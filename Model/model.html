    <script id="vertex-shader" type="x-shader/x-vertex">
      #version 300 es

      in vec4 aPosition;
      in vec4 aColor;

      uniform float uAngle;
      uniform vec2 uPivot;

      uniform vec2 uOffset;
      uniform float uScale;

      out vec4 vColor;

      void main()
      {
        float cosine = cos(uAngle);
        float sine = sin(uAngle);

        vec2 translated = aPosition.xy - uPivot;

        vec2 rotated = vec2(
          translated.x * cosine - translated.y * sine,
          translated.x * sine + translated.y * cosine
        );

        vec2 rotatedPosition = rotated + uPivot;
        vec2 finalPosition = rotatedPosition * uScale + uOffset;

        gl_Position = vec4(finalPosition, 0.0, 1.0);
        vColor = aColor;
      }
    </script>
    <script id="fragment-shader" type="x-shader/x-fragment">
      #version 300 es
      precision mediump float;
      in vec4 vColor;
      out vec4 fColor;
      void main()
      {
       fColor = vColor;
      }
    </script>
    <script type="text/javascript" src="../Common/initShaders.js"></script>
    <script src="./model.js"></script>
    <canvas id="gl-canvas" width="600" height="600"></canvas>
  </body>
